name: Release

# MaxUsage currently ships directly from GitHub without an Apple Developer ID certificate.
# Release archives are ad-hoc signed and intentionally omit a Sparkle feed: Sparkle must not offer
# an update that Gatekeeper cannot verify as a notarized Developer ID build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for example v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: maxusage-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve tag, version, and channel
        id: meta
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if [[ "$TAG" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Test
        working-directory: app
        run: swift test

      - name: Build ad-hoc signed DMG
        working-directory: app
        env:
          MAXUSAGE_SIGNING_IDENTITY: "-"
        run: ./script/package_release.sh "${{ steps.meta.outputs.version }}"

      - name: Verify package identity
        working-directory: app
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          test -f "dist/MaxUsage-$VERSION.dmg"
          test -d "dist/MaxUsage.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' dist/MaxUsage.app/Contents/Info.plist)" = "MaxUsage"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/MaxUsage.app/Contents/Info.plist)" = "com.1c7.maxusage"
          /usr/bin/codesign --verify --deep --strict --verbose=2 dist/MaxUsage.app

      - name: Create stable-named DMG alias
        working-directory: app
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: cp "dist/MaxUsage-$VERSION.dmg" "dist/MaxUsage.dmg"

      - name: Publish DMG to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MaxUsage ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: |
            app/dist/MaxUsage-${{ steps.meta.outputs.version }}.dmg
            app/dist/MaxUsage.dmg
          fail_on_unmatched_files: true

      - name: Update Homebrew tap
        if: steps.meta.outputs.prerelease != 'true'
        env:
          # Fine-grained PAT with Contents read/write on 1c7/homebrew-tap; the
          # workflow-scoped GITHUB_TOKEN cannot push to another repository.
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::TAP_TOKEN is not set; skipping Homebrew tap update."
            exit 0
          fi
          SHA=$(shasum -a 256 "app/dist/MaxUsage-$VERSION.dmg" | cut -d' ' -f1)
          git clone "https://x-access-token:$TAP_TOKEN@github.com/1c7/homebrew-tap.git" tap
          cd tap
          sed -i '' \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
            Casks/max-usage.rb
          if git diff --quiet; then
            echo "Tap already points at $VERSION; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/max-usage.rb
          git commit -m "max-usage $VERSION"
          git push
